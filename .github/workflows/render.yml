name: Render five-second film

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'assets/audio/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - '.github/workflows/render.yml'

permissions:
  contents: read

concurrency:
  group: film-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check scene, assets and seek determinism
        run: |
          python scripts/audio.py
          npm run check
      - name: Render video
        run: npm run render -- --workers 2
      - name: Render storyboard stills
        run: npm run stills
      - name: Upload film and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-to-plan-film
          if-no-files-found: error
          retention-days: 30
          path: |
            output/idea-to-plan-5s.mp4
            output/contact-sheet.jpg
            output/stills/*.png
            output/qa*.json
            output/check.json
